<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" role="img" aria-label="Three panels. ToMe can merge a near-object token with a background token. ToSA makes this less likely. The Depth methods merge only inside one depth region and keep the edge tokens.">
<style>
svg { --bg:#fcfcfb; --far:#dde6f0; --near:#f4dcb4; --ink:#0b0b0b; --ink2:#52514e; --line:#2a78d6; --bad:#d03b3b; }
@media (prefers-color-scheme: dark) { svg { --bg:#1a1a19; --far:#2b3644; --near:#4d3c22; --ink:#f0efec; --ink2:#c3c2b7; --line:#6da7ec; --bad:#e66767; } }
.m-bg { fill: var(--bg); }
.m-far { fill: var(--far); }
.m-near { fill: var(--near); }
.m-keep { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 2; }
.m-region { fill: none; stroke: var(--ink); stroke-width: 2; }
.m-ok { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.m-bad { stroke: var(--bad); stroke-width: 3; stroke-linecap: round; }
.m-no { stroke: var(--ink2); stroke-width: 2; stroke-dasharray: 4 3; }
.m-dot-ok { fill: var(--line); } .m-dot-bad { fill: var(--bad); } .m-dot-no { fill: var(--ink2); }
.m-x { stroke: var(--bad); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.m-title { fill: var(--ink); font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
.m-cap { fill: var(--ink2); font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
.m-leg { fill: var(--ink2); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
